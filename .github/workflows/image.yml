name: image

# Publishes ghcr.io/huggingface/relore:sha-<commit> on every push to main, and
# :latest alongside it.
#
# The tag is the commit, and the deploy pins it. Section 15's deployment is not
# meant to move because someone merged: a values file naming `sha-abc1234` is a
# release you can point at, and `latest` exists for a first install and for
# people trying it, not for production.
on:
  push:
    branches: [main]
    # No point rebuilding for a docs-only change; the image holds relore/ and the
    # packaging metadata and nothing else (see .dockerignore).
    paths:
      - "relore/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
