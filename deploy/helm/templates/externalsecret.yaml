{{- if .Values.externalSecret.enabled }}
#------------------------------------------------------------------------------
# External secret-management resource.
#
# Provider-neutral: supply apiVersion, kind and spec from the deployment's values
# for whatever operator that environment runs (Infisical's InfisicalSecret on the
# open-source cluster). It produces the Secret named by `existingSecret`, which
# every workload consumes via envFrom.
#
# What belongs in it, and nothing else:
#   GITHUB_TOKEN        `issues:read` + `pull_requests:read`. Never write scope --
#                       build-plan section 11: the indexer never needs one and
#                       should never be given one.
#   RELORE_API_TOKENS   bearer tokens, each scoped to a set of repositories
#                       (section 7). Without at least one, `serve` refuses to bind
#                       anything but loopback.
#   POSTGRES_PASSWORD   consumed by the database and by everything that reaches it.
#------------------------------------------------------------------------------
apiVersion: {{ required "externalSecret.apiVersion is required when externalSecret.enabled=true" .Values.externalSecret.apiVersion }}
kind: {{ required "externalSecret.kind is required when externalSecret.enabled=true" .Values.externalSecret.kind }}
metadata:
  name: {{ .Values.externalSecret.name | default .Values.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "labels.standard" . | nindent 4 }}
spec:
{{- tpl (toYaml .Values.externalSecret.spec) . | nindent 2 }}
{{- end }}
