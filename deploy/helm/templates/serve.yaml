#------------------------------------------------------------------------------
# `relored serve` -- the HTTP JSON API and the section 8 web UI.
#
# Two guardrails the daemon enforces itself (build-plan section 13.1 #6) and this
# chart has to respect:
#   * it refuses a SQLite URL, which cannot arise here;
#   * with no tokens configured it binds loopback only. So `--host 0.0.0.0` is
#     paired with RELORE_API_TOKENS from the Secret, and a release that forgets
#     the token gets a pod that answers nothing rather than an open index.
#------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "labels.standard" . | nindent 4 }}
spec:
  replicas: {{ .Values.serve.replicas }}
  {{- if or .Values.labels.enabled .Values.clones.enabled }}
  # The PVCs are ReadWriteOnce and a rolling update starts the replacement first, so it
  # would sit Pending on a volume still attached to the old pod's node.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "app.name" . }}
      component: serve
  template:
    metadata:
      labels:
        {{- include "labels.standard" . | nindent 8 }}
        component: serve
      annotations:
        # Section 6.2's bot list and the repo allowlist live in the ConfigMap, and
        # neither is in the pod template -- so a change to either updates the
        # ConfigMap and leaves this process on its old config. The checksum puts
        # them back in the template, which is what makes helm roll the pod.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      {{- if or .Values.labels.enabled .Values.clones.enabled }}
      # The image runs as uid 10001 and a CSI volume arrives root-owned, so without this
      # `relored clone` cannot write -- nor can section 8's label append.
      securityContext:
        fsGroup: 10001
        # Or the kubelet re-chowns every file of a large clone on each start.
        fsGroupChangePolicy: OnRootMismatch
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      # `relored migrate`, as an init container rather than a Helm hook.
      #
      # It was a `pre-install` hook, and that cannot work here. Helm runs every
      # pre-install hook *before* ordinary resources, so the hook's pod referenced a
      # Secret the Infisical operator had not been asked to create yet and sat in
      # CreateContainerConfigError until the release timed out. Making the
      # InfisicalSecret a hook too, ordered ahead of it, only moved the deadlock:
      # Helm waits for a hook to become ready, and that CR reports its state as
      # `secrets.infisical.com/ReadyToSyncSecrets` rather than a `Ready` condition,
      # so the readiness watcher never returns.
      #
      # As an init container the ordering problem disappears: everything is an
      # ordinary resource, the operator syncs the Secret within seconds, and a pod
      # whose Secret is briefly missing stays in CreateContainerConfigError while
      # the kubelet retries -- so it starts on its own rather than deadlocking.
      #
      # Only `serve` runs it. `poll` deliberately does not: two workloads migrating
      # concurrently would race on the same DDL, and a poll pod that starts before
      # the schema exists crash-loops and recovers, which is the cheaper failure.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h {{ include "name" . }}-postgres -U {{ .Values.postgres.user }} >/dev/null 2>&1; do
                echo "waiting for postgres"; sleep 3
              done
              exec relored {{ if ge (int .Values.verbosity) 1 }}-v {{ end }}migrate
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: RELORE_DATABASE_URL
              value: {{ include "relore.databaseUrl" . | quote }}
          resources: {{ toYaml .Values.migrate.resources | nindent 12 }}
      containers:
        - name: serve
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [{{ include "relore.verbosity" . }}"serve", "--host", "0.0.0.0", "--port", "8080"{{ if .Values.api.trustNetwork }}, "--trust-network"{{ end }}]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "name" . }}-config
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            # Declared here and *before* the URL on purpose: Kubernetes expands
            # `$(VAR)` in an env value only from the container's own `env` list,
            # never from `envFrom`. Taking the password from the Secret via
            # `envFrom` alone would ship a connection string containing the
            # literal text `$(POSTGRES_PASSWORD)` — which fails at connect time,
            # not at render time, so `helm template` would look correct.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: RELORE_DATABASE_URL
              value: {{ include "relore.databaseUrl" . | quote }}
            {{- if .Values.api.trustNetwork }}
            # Emptied *after* `envFrom`, so a token left behind in the secret store
            # cannot quietly re-enable authentication on a deployment whose perimeter is
            # the network. The absence is then a property of this release, not of what
            # somebody remembered to delete in Infisical.
            - name: RELORE_API_TOKENS
              value: ""
            {{- end }}
          {{- if or .Values.labels.enabled .Values.clones.enabled }}
          # labels first: the clone root is inside its mount, and mounts apply in order.
          volumeMounts:
            {{- if .Values.labels.enabled }}
            - name: labels
              mountPath: {{ dir .Values.labels.path }}
            {{- end }}
            {{- if .Values.clones.enabled }}
            - name: clones
              mountPath: {{ .Values.clones.path }}
            {{- end }}
          {{- end }}
          # `/metrics`, not `/api/v1/status`. Status requires a bearer token whenever
          # tokens are configured (section 7 scopes every endpoint that returns
          # content), so a probe against it gets 401, readiness never passes and
          # liveness restarts a perfectly healthy process. That it happens to answer
          # under `api.trustNetwork` is not a reason to probe it: the probe must not
          # change meaning with the auth mode. `/metrics` is unauthenticated on purpose
          # -- it carries counts, never content -- which makes it the one endpoint a
          # kubelet can ask either way.
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources: {{ toYaml .Values.serve.resources | nindent 12 }}
      {{- if or .Values.labels.enabled .Values.clones.enabled }}
      volumes:
        {{- if .Values.labels.enabled }}
        # Section 10's evaluation set has to land somewhere, and section 15 says the
        # thing only real use can produce is human-judged ground truth. A byproduct
        # of use beats a chore nobody schedules -- but only if the file survives a
        # pod restart, so it is a PVC and not an emptyDir.
        - name: labels
          persistentVolumeClaim:
            claimName: {{ include "name" . }}-labels
        {{- end }}
        {{- if .Values.clones.enabled }}
        # A PVC, not an emptyDir: re-cloning transformers on each restart is minutes of 503s.
        - name: clones
          persistentVolumeClaim:
            claimName: {{ include "name" . }}-clones
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "labels.standard" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "app.name" . }}
    component: serve
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.clones.enabled }}
---
# ReadWriteOnce, and the serve pod holds it -- which is why `relored clone` is an
# `exec` into that pod and not a Job, and why `serve.replicas` stays 1.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "name" . }}-clones
  namespace: {{ .Release.Namespace }}
  labels: {{ include "labels.standard" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.clones.storageClass }}
  storageClassName: {{ .Values.clones.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.clones.size | quote }}
{{- end }}
{{- if .Values.labels.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "name" . }}-labels
  namespace: {{ .Release.Namespace }}
  labels: {{ include "labels.standard" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.labels.storageClass }}
  storageClassName: {{ .Values.labels.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.labels.size | quote }}
{{- end }}
